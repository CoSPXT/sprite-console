name: Build Windows app
on:
  workflow_dispatch:
    inputs:
      publish:
        description: 'Attach the files to the latest GitHub Release'
        type: boolean
        default: false
  push:
    tags: ['desktop-v*']
permissions:
  contents: write
jobs:
  build:
    runs-on: windows-latest
    defaults: { run: { working-directory: desktop } }
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 20 }
      - run: npm install
      - run: npm run dist
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: 'false'
      - uses: actions/upload-artifact@v4
        with:
          name: SpriteConsole-windows
          path: desktop/dist/*.exe
      - name: Attach to release
        if: startsWith(github.ref, 'refs/tags/desktop-v') || inputs.publish
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          TAG="${GITHUB_REF_NAME}"
          if [[ "$GITHUB_REF" != refs/tags/* ]]; then TAG=$(gh release list --repo "$GITHUB_REPOSITORY" --limit 1 --json tagName --jq '.[0].tagName'); fi
          if [ -z "$TAG" ]; then echo "No release found. Create a release first."; exit 1; fi
          gh release view "$TAG" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1 || gh release create "$TAG" --repo "$GITHUB_REPOSITORY" --title "Sprite Console" --notes "Windows installer and portable app."
          gh release upload "$TAG" dist/*.exe --repo "$GITHUB_REPOSITORY" --clobber
